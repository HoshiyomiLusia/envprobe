# Tools and services envprobe detects.
#
# [[tool]]:    name, command, args (default ["--version"]),
#              stream ("stdout"|"stderr"|"both", default "stdout"),
#              version_regex (one capture group), not_found_regex (optional), category
# [[service]]: name, category, macos_match (launchctl label substring),
#              linux_units (systemd unit names, tried in order)
# Category values: see src/model.rs.

# ===== VCS =====
[[tool]]
name = "git"
command = "git"
version_regex = 'git version (\S+)'
category = "vcs"

[[tool]]
name = "hg"
command = "hg"
version_regex = 'version (\S+?)\)'
category = "vcs"

[[tool]]
name = "svn"
command = "svn"
version_regex = 'svn, version (\S+)'
category = "vcs"

[[tool]]
name = "fossil"
command = "fossil"
version_regex = 'version (\S+)'
category = "vcs"

