# ===== Services =====
[[service]]
name = "nginx"
category = "web-server"
macos_match = "nginx"
linux_units = ["nginx.service"]

[[service]]
name = "apache"
category = "web-server"
macos_match = "httpd"
linux_units = ["apache2.service", "httpd.service"]

[[service]]
name = "caddy"
category = "web-server"
macos_match = "caddy"
linux_units = ["caddy.service"]

[[service]]
name = "postgresql"
category = "database"
macos_match = "postgresql"
linux_units = ["postgresql.service"]

[[service]]
name = "mysql"
category = "database"
macos_match = "mysql"
linux_units = ["mysql.service", "mariadb.service"]

[[service]]
name = "mongodb"
category = "database"
macos_match = "mongodb"
linux_units = ["mongod.service"]

[[service]]
name = "redis"
category = "database"
macos_match = "redis"
linux_units = ["redis.service", "redis-server.service"]

[[service]]
name = "clickhouse"
category = "database"
macos_match = "clickhouse"
linux_units = ["clickhouse-server.service"]

[[service]]
name = "minio"
category = "database"
macos_match = "minio"
linux_units = ["minio.service"]

[[service]]
name = "docker"
category = "container"
macos_match = "com.docker.docker"
linux_units = ["docker.service"]
